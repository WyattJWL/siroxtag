<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salle — Siroxtag</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/assets/css/extra.css">
</head>
<body class="dark">
<header class="top">
  <a class="brand" href="/" aria-label="Siroxtag, accueil">Siroxtag<span class="dot"></span></a>
</header>
<main class="xp">
  <p class="lab">Chasse au trésor</p>
  <h1 class="h2" style="margin-top:14px">La salle du <span class="it">trésor</span>.</h1>
  <p class="lead m" style="margin-top:22px">Quatre fragments sont cachés sur le site. Mis dans l’ordre, ils forment une phrase. Écris-la ici pour ouvrir le coffre.</p>
  <div class="slots" data-slots></div>
  <p class="m" style="margin-top:16px;font-size:15px">Besoin d’un indice ? Ouvre le terminal en bas à droite et tape <b>/chasse</b>.</p>
  <form class="tform" data-form>
    <label class="sr" for="phrase" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">La phrase secrète</label>
    <input id="phrase" autocomplete="off" placeholder="La phrase secrète…" spellcheck="false">
    <button class="btn" type="submit">Ouvrir le coffre <span class="ar">→</span></button>
  </form>
  <p class="tmsg" data-msg aria-live="polite"></p>
  <div data-reward></div>
  <a class="x-back" href="/">← Retour à l’accueil</a>
</main>
<script src="/assets/js/term.js" data-site="siroxtag" defer></script>
<script>
addEventListener('DOMContentLoaded', () => {
  const slots = document.querySelector('[data-slots]'), msg = document.querySelector('[data-msg]'), rew = document.querySelector('[data-reward]');
  const got = () => (window.SX ? window.SX.hunt.get() : []);
  const draw = () => { const f = got(); slots.innerHTML = [1, 2, 3, 4].map(n => `<div class="slot${f.includes(n) ? ' ok' : ''}"><small>Fragment ${n}</small><b>${f.includes(n) && window.SX ? window.SX.hunt.frag(n) : '????'}</b></div>`).join(''); };
  draw(); addEventListener('focus', draw);
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z]/g, '');
  function win(first) {
    let d = null; try { d = localStorage.getItem('sx-hunt-done'); if (!d) { d = new Date().toLocaleDateString('fr-FR', { dateStyle: 'long' }); localStorage.setItem('sx-hunt-done', d); } } catch (e) {}
    rew.innerHTML = `<div class="reward"><div class="cup" aria-hidden="true">🏆</div><h2>Chasseur de lumière.</h2><p>Coffre ouvert${d ? ' le ' + d : ''}. Tu fais partie des rares visiteurs à avoir tout trouvé : le jeu, le musée, le noir et le vieux code de triche.</p><p style="margin-top:14px">La phrase était aussi la devise de BLACKOUT.</p><p style="margin-top:20px"><a class="btn" href="https://blackouthorror.fr/" target="_blank" rel="noopener">Découvrir BLACKOUT <span class="ar">↗</span></a></p></div>`;
    msg.textContent = '';
    if (first && window.SX) { window.SX.confettis(); setTimeout(window.SX.confettis, 900); window.SX.ach('tresor'); }
  }
  try { if (localStorage.getItem('sx-hunt-done')) win(false); } catch (e) {}
  const sha = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map(b => b.toString(16).padStart(2, '0')).join('');
  document.querySelector('[data-form]').addEventListener('submit', async e => {
    e.preventDefault(); const v = norm(document.getElementById('phrase').value);
    if (v && await sha(v) === '675f4604403fba0aff4f1c1ba5c6db68a87eada04fe31e41379bbdeb63ee7d81') { win(true); return; }
    const n = got().length;
    msg.textContent = v ? (n < 4 ? `Ce n’est pas ça. Il te manque encore ${4 - n} fragment${4 - n > 1 ? 's' : ''}.` : 'Ce n’est pas ça. Essaie de remettre les fragments dans l’ordre.') : 'Écris d’abord quelque chose.';
    if (window.SX) window.SX.shake();
  });
});
</script>
</body>
</html>
